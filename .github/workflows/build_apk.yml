name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake \
            libffi-dev libssl-dev \
            adb wget

      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Inject latest yt-dlp version
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          echo "yt-dlp latest: $LATEST"
          sed -i "s|yt-dlp,|yt-dlp==$LATEST,|g" buildozer.spec
          grep yt-dlp buildozer.spec || true

      - name: Setup Android SDK Command-line Tools & Accept Licenses
        run: |
          # 1. التوجه مباشرة إلى مجلد Android SDK المستهدف
          ANDROID_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_ROOT"
          cd "$ANDROID_ROOT"
          
          # 2. تحميل أدوات cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
          unzip -q cmd.zip
          rm cmd.zip
          
          # 3. إعادة ترتيب المجلدات داخلياً بأمان تام (بدون استخدام متغيرات معقدة)
          mv cmdline-tools latest
          mkdir cmdline-tools
          mv latest cmdline-tools/
          
          # 4. إنشاء مسار tools الوهمي لـ Buildozer
          ln -s "\(PWD/cmdline-tools/latest" "\)PWD/tools"
          
          # 5. قبول جميع التراخيص
          yes | ./cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytdownloader-apk
          path: bin/*.apk
