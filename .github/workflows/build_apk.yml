name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]" yt-dlp

      - name: Create Flet App Directory Structure
        run: |
          mkdir -p assets
          flet create temp_app
          cp main.py temp_app/
          cp requirements.txt temp_app/ 2>/dev/null || true

      - name: Build APK
        run: |
          cd temp_app
          flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: temp_app/build/apk/*.apk
