name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake \
            libffi-dev libssl-dev \
            adb

      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Inject latest yt-dlp version
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          echo "yt-dlp latest: $LATEST"
          sed -i "s|yt-dlp,|yt-dlp==$LATEST,|g" buildozer.spec
          grep yt-dlp buildozer.spec

      - name: Auto-accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # تجهيز ملفات الموافقة المسبقة على التراخيص مباشرة
          ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n8933b522257f6535150f81211ce12313b0d782d0\n734b2258ba17d1780c97823b2c81864422934030\na5a018303038703a4e9a3f28328f41065538e12d" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a578f30576952de7e0e4131aedc" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Build debug APK
        run: |
          # القبول المتكرر اللانهائي لكل الشروط ومطالبات التحديث
          yes y | buildozer android debug
