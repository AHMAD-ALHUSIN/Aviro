name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake \
            libffi-dev libssl-dev \
            adb wget

      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Inject latest yt-dlp version
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          echo "yt-dlp latest: $LATEST"
          sed -i "s|yt-dlp,|yt-dlp==$LATEST,|g" buildozer.spec
          grep yt-dlp buildozer.spec || true

      - name: Setup Android SDK Command-line Tools & Accept Licenses
        run: |
          # 1. تحديد وتجهيز مسار Android SDK الخاص بـ Buildozer
          export ANDROID_HOME="${HOME}/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          
          # 2. تحميل أدوات cmdline-tools الحديثة من جوجل
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          
          # 3. إعادة تسمية المجلد المستخرج إلى "latest" (مطلوب لعمل sdkmanager بشكل صحيح)
          mv "\(ANDROID_HOME/cmdline-tools/cmdline-tools" "\)ANDROID_HOME/cmdline-tools/latest"
          
          # 4. إنشاء مسار "tools" الوهمي الذي يبحث عنه Buildozer وربطه بالمسار الحقيقي
          ln -s "\(ANDROID_HOME/cmdline-tools/latest" "\)ANDROID_HOME/tools"
          
          # 5. قبول جميع تراخيص أندرويد وتجاهل خطأ Broken pipe
          export PATH="\(ANDROID_HOME/cmdline-tools/latest/bin:\)PATH"
          yes | sdkmanager --licenses || true

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytdownloader-apk
          path: bin/*.apk
