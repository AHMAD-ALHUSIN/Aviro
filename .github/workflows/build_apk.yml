name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # بيئة التشغيل الأساسية لـ GitHub Actions
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ضروري جداً لعمل أدوات Android SDK الحديثة بدون الانهيار الصامت
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake \
            libffi-dev libssl-dev \
            adb wget

      # تثبيت نسخة مستقرة من Cython لتجنب مشاكل الترجمة
      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==3.0.10

      # جلب أحدث إصدار من yt-dlp ديناميكياً وإضافته لـ buildozer.spec
      - name: Inject latest yt-dlp version
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          echo "yt-dlp latest: $LATEST"
          sed -i "s|yt-dlp,|yt-dlp==$LATEST,|g" buildozer.spec || true
          grep "^requirements =" buildozer.spec || true

      # الحل الجذري لمشكلة تراخيص الأندرويد وتجهيز الـ SDK
      - name: Setup Android SDK Command-line Tools & Accept Licenses
        run: |
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /home/runner/cmdline-tools.zip
          unzip -q /home/runner/cmdline-tools.zip -d /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools
          mv /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          rm /home/runner/cmdline-tools.zip
          ln -s /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest /home/runner/.buildozer/android/platform/android-sdk/tools
          yes | /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytdownloader-apk
          path: bin/*.apk
