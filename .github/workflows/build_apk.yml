name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject latest yt-dlp version into buildozer.spec
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          echo "yt-dlp latest version: $LATEST"
          sed -i "s/yt-dlp/$LATEST_PLACEHOLDER/" buildozer.spec || true
          sed -i "s|yt-dlp,|yt-dlp==$LATEST,|g" buildozer.spec
          grep yt-dlp buildozer.spec

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ytdownloader-apk
          path: ${{ steps.buildozer.outputs.filename }}
