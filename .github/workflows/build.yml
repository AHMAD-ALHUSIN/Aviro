name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Download FFmpeg Binary for Android (arm64-v8a)
        run: |
          echo "Downloading official compiled FFmpeg for Android..."
          wget https://github.com/artic-fox/ffmpeg-android-maker/releases/download/v5.0.1/ffmpeg-android-maker-v5.0.1-arm64-v8a.zip -O ffmpeg.zip
          unzip -o ffmpeg.zip
          cp ffmpeg/bin/ffmpeg ./ffmpeg
          chmod +x ./ffmpeg
          ls -lh ./ffmpeg

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-APK
          path: bin/*.apk
