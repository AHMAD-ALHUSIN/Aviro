name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build FFmpeg using ffmpeg-android-maker
        run: |
          echo "Cloning ffmpeg-android-maker..."
          git clone https://github.com/Javernaut/ffmpeg-android-maker.git ffmpeg-maker
          cd ffmpeg-maker
          
          echo "Building FFmpeg binary for arm64-v8a..."
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          ./ffmpeg-android-maker.sh -a arm64-v8a
          
          echo "Copying generated binary..."
          cp output/bin/ffmpeg ../ffmpeg
          cd ..
          chmod +x ./ffmpeg
          
          echo "Verifying FFmpeg size..."
          ls -lh ./ffmpeg

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-APK
          path: bin/*.apk
