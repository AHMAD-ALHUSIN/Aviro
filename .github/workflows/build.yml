name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autoconf automake pkg-config libffi-dev libssl-dev gettext cmake zip unzip openjdk-17-jdk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython>=0.29.36,<3" buildozer

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set Executable Permissions for FFmpeg
        run: |
          if [ -f "./ffmpeg" ]; then
            chmod +x ./ffmpeg
            ls -lh ./ffmpeg
          fi

      - name: Show repo layout and spec
        run: |
          echo "=== java folder ==="
          find . -path ./.git -prune -o -ipath "*mediamerger*" -print
          echo "=== spec add_src ==="
          grep -n "add_src\|include_exts\|source.dir" buildozer.spec || true
          echo "=== package line ==="
          head -5 java/org/myapp/MediaMerger.java || true

      - name: Build APK with Buildozer
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Check Java file was copied
        if: always()
        run: |
          echo "=== Java source in build dir ==="
          find .buildozer -iname "MediaMerger*" || echo "NOT FOUND"
          echo "=== log mentions ==="
          grep -n -i "mediamerger\|add_src\|javac" build.log | head -40 || true

      - name: Check class inside APK
        if: always()
        run: |
          mkdir -p apk_out
          unzip -o bin/*.apk 'classes*.dex' -d apk_out
          for f in apk_out/classes*.dex; do
            strings "$f" | grep "Lorg/myapp/MediaMerger;" && echo "FOUND in $f"
          done || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-APK
          path: bin/*.apk
