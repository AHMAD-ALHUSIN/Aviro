name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake \
            libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          # تثبيت pip بإصدار متوافق مع بيئة python-for-android
          pip install "pip==23.1.2"
          pip install setuptools wheel
          pip install "buildozer>=1.5.0" "cython==0.29.36"

      - name: Inject latest yt-dlp version
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          echo "yt-dlp latest: $LATEST"
          sed -i "s|yt-dlp,|yt-dlp==$LATEST,|g" buildozer.spec
          grep yt-dlp buildozer.spec

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytdownloader-apk
          path: bin/*.apk
