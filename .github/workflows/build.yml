name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # لازم لإنشاء GitHub Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autoconf automake pkg-config libffi-dev libssl-dev gettext cmake zip unzip openjdk-17-jdk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython>=0.29.36,<3" buildozer

      # كاش لتسريع البناء (SDK / NDK / python-for-android)
      - name: Cache Buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set Executable Permissions for FFmpeg
        run: |
          if [ -f "./ffmpeg" ]; then
            chmod +x ./ffmpeg
            ls -lh ./ffmpeg
          fi

      # ---------- التوقيع ----------
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret KEYSTORE_B64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aviro.keystore"

      # ---------- رقم الإصدار يزيد تلقائياً مع كل build ----------
      - name: Set version numbers
        run: |
          sed -i -E "s/^android\.numeric_version.*/android.numeric_version = ${{ github.run_number }}/" buildozer.spec
          echo "BUILD_NUMBER = ${{ github.run_number }}" > build_info.py
          grep -n "^version\|numeric_version" buildozer.spec
          cat build_info.py

      - name: Build signed release APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/aviro.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASS }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASS }}
        run: |
          yes | buildozer -v android release 2>&1 | tee build.log

      - name: Verify APK signature
        run: |
          ls -lh bin/
          APK=$(ls bin/*release*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found in bin/"
            exit 1
          fi
          APKSIGNER=$(find ~/.buildozer -name apksigner -type f | head -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi
          echo "APK: $APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | head -15
          # نسخة باسم ثابت للتحميل / التحديث
          cp "$APK" bin/Aviro.apk

      - name: Check class inside APK
        if: always()
        run: |
          [ -f bin/Aviro.apk ] || exit 0
          mkdir -p apk_out
          unzip -o bin/Aviro.apk 'classes*.dex' -d apk_out || true
          for f in apk_out/classes*.dex; do
            strings "$f" | grep -q "Lorg/myapp/MediaMerger;" && echo "MediaMerger FOUND in $f"
          done || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-APK
          path: bin/Aviro.apk

      # ---------- نشر Release (يستخدمه التطبيق للتحقق من وجود تحديث) ----------
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Aviro build ${{ github.run_number }}
          files: bin/Aviro.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aviro.keystore"
