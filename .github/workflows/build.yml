name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # التغيير الهام: استخدام ubuntu-22.04 المضمون والمتوافق مع Buildozer و Python 3.11
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autoconf automake pkg-config libffi-dev libssl-dev gettext cmake zip unzip openjdk-17-jdk

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install "cython<3" buildozer

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set Executable Permissions for FFmpeg
        run: |
          if [ -f "./ffmpeg" ]; then
            chmod +x ./ffmpeg
            ls -lh ./ffmpeg
          fi

      - name: Build APK with Buildozer
        # إلغاء توجيهات NDK القديمة من البيئة وتحديد JAVA_HOME الصحيحة
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
        run: |
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-APK
          path: bin/*.apk
