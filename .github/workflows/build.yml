name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Download FFmpeg Binary for Android (arm64-v8a)
        run: |
          echo "Downloading prebuilt FFmpeg binary for Android..."
          curl -L -o ffmpeg https://github.com/hzw1199/Android-FFmpeg-Prebuilt/raw/main/ffmpeg-9.0/ffmpeg
          chmod +x ffmpeg
          ls -la ffmpeg

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-APK
          path: bin/*.apk
