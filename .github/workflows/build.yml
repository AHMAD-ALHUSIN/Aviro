name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Download FFmpeg Binary for Android (arm64-v8a)
        run: |
          echo "Downloading FFmpeg binary for Android arm64-v8a..."
          # تنزيل ملف ffmpeg التنفيذي المجمع المخصص للأندرويد مباشرة
          curl -L -o ffmpeg https://raw.githubusercontent.com/Kakuec/ffmpeg-android-executable/main/arm64-v8a/ffmpeg
          chmod +x ffmpeg
          # طباعة حجم الملف للتأكد من اكتمال التنزيل
          ls -lh ffmpeg

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-APK
          path: bin/*.apk
