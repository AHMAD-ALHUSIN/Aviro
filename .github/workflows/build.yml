name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autoconf automake pkg-config libffi-dev libssl-dev gettext cmake zip unzip

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          # تثبيت Cython إصدار 0.29 لضمان التوافق مع Kivy و p4a
          pip install "cython<3" buildozer

      - name: Set Executable Permissions for FFmpeg
        run: |
          if [ -f "./ffmpeg" ]; then
            chmod +x ./ffmpeg
            ls -lh ./ffmpeg
          else
            echo "تنبيه: ملف ffmpeg غير موجود في الجذر الرئيسي للمستودع!"
          fi

      - name: Build APK with Buildozer
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-APK
          path: bin/*.apk
