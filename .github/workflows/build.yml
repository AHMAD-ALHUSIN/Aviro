name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Inject latest yt-dlp version
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          echo "yt-dlp latest: $LATEST"
          sed -i "s|yt-dlp,|yt-dlp==$LATEST,|g" buildozer.spec
          grep yt-dlp buildozer.spec

      - name: Build APK (Official Kivy Docker Image)
        run: |
          docker run --rm \
            --volume "$(pwd)":/home/user/hostcwd \
            kivy/buildozer:latest \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ytdownloader-apk
          path: bin/*.apk
